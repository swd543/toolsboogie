[package]
name = "toolcore"
version = "0.1.0"
edition = "2021"
description = "WASM core for in-browser tools: JSON/YAML/TOML/INI data conversion (serde) and FFT-based pitch detection (rustfft)"
license = "MIT"

[lib]
name = "toolcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
quick-xml = "0.36"
rust-ini = "0.21"
rustfft = "6"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.9"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
